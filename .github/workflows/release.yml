name: Release

# Push a tag like v1.0.0 or v1.0.0-beta.2: the plugin zip is attached to a
# GitHub release, and the bridge is published to npm through Trusted Publishing
# (OIDC, configured on npmjs.com for this workflow): no npm token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches plugin version
        run: |
          VERSION="$(sed -n "s/^define( 'OKNO_VERSION', '\(.*\)' );/\1/p" plugin/okno.php)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build zip
        run: ./scripts/build-zip.sh

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          # Relancer le workflow sur un tag déjà publié remplace le zip au
          # lieu d'échouer (utile si seule la publication npm avait raté).
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/okno-$VERSION.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/okno-$VERSION.zip" \
              --title "Okno $VERSION" --notes-file notes.md $PRERELEASE
          fi

      - name: Publish bridge to npm
        working-directory: bridge
        run: |
          # Trusted Publishing needs npm 11.5.1 or later.
          npm install -g npm@latest
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          if npm view "$(node -p "require('./package.json').name")@$VERSION" version > /dev/null 2>&1; then
            echo "Already on npm, skipping."
            exit 0
          fi
          npm publish --access public --provenance --tag "$TAG"
