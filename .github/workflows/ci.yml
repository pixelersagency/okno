name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find plugin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: |
          php plugin/tests/test-acf-adapter.php
          php plugin/tests/test-activity.php
          php plugin/tests/test-frame-verdict.php
          php plugin/tests/smoke-load.php

  bridge:
    name: Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        working-directory: bridge
        run: npm run build
      - name: Built files are committed
        run: git diff --exit-code -- bridge/dist plugin/assets/bridge
      - name: Syntax
        run: |
          node --check plugin/assets/admin/editor.js
          node --check plugin/assets/admin/admin.js

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [php, bridge]
    steps:
      - uses: actions/checkout@v5
      - name: Build zip
        run: ./scripts/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: okno-plugin
          path: dist/*.zip
