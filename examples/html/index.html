<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>About us</title>

    <!-- Okno: loads the bridge only inside the editor. -->
    <script>
      if (window.self !== window.top) {
        var s = document.createElement('script');
        s.src = '/okno-bridge.js';
        s.setAttribute('data-wp-origin', 'https://wp.example.com');
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <!-- 12 = the WordPress post ID of this page. -->
    <main data-wp-post="12">
      <h1 data-wp-field="_title">About us</h1>
      <p data-wp-field="intro">We build things.</p>
      <img data-wp-field="hero_image" src="/hero.jpg" alt="" />

      <!-- A group field: dotted path to its sub-field. -->
      <address data-wp-field="contact.address">1 Main Street</address>

      <!-- Content Okno doesn't edit: clicking it explains where to go. -->
      <nav data-okno-managed="menu" data-okno-edit-url="https://wp.example.com/wp-admin/nav-menus.php">
        <a href="/">Home</a> <a href="/about">About</a>
      </nav>
    </main>
  </body>
</html>
